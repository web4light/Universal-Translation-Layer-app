# ============================================================
#  Asterisk (*) & OBELIX — Sovereign WebMCP Mesh Stack
#  Web: https://web4light.online
# ============================================================

services:

  # ============================================================
  # OBELIX — Heavyweight Compute Node & SPARK Vault
  # ============================================================
  obelix:
    build:
      context: ..
      dockerfile: docker/Dockerfile.obelix
    container_name: obelix-heavy-node
    restart: unless-stopped
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SOLAR_BATTERY_STACK=100
      - SPARK_FORMAL_MODE=ON
    ports:
      - "8423:8000"
      - "9312:9302"
      - "9317:9307"
    networks:
      - asgardlab

  # ============================================================
  # ASTERISK (*) — WebMCP Client & 3D Accessibility Studio
  # ============================================================
  asterisk-webmcp:
    image: nginx:alpine
    container_name: asterisk-webmcp-studio
    restart: unless-stopped
    volumes:
      - ../web:/usr/share/nginx/html:ro
    ports:
      - "8085:80"
    depends_on:
      - obelix
    networks:
      - asgardlab

networks:
  asgardlab:
    driver: bridge
