# Prometheus konfigurace pro Vakuovou Mincovnu
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'vakuova-mincovna'
    standard: '700'

scrape_configs:
  - job_name: 'mincovna-core'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          component: 'ada-spark-core'
          
  - job_name: 'faucet-dns'
    static_configs:
      - targets: ['localhost:9091']
        labels:
          component: 'erlang-faucet'
          
  - job_name: 'system-resources'
    static_configs:
      - targets: ['localhost:9100']
        labels:
          component: 'node-exporter'
          verification: 'faucet-nic'
